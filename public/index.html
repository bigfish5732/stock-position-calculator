<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>股票仓位计算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 登录 / 注册 -->
  <div id="auth-view" class="auth-wrap">
    <div class="auth-card">
      <div class="logo">📈</div>
      <h1>股票仓位计算器</h1>
      <p class="sub">仓位规划 · 分批建仓 · 止损止盈 · 超仓提醒</p>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">登录</button>
        <button id="tab-register" class="tab" type="button">注册</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>用户名</span>
          <input id="auth-username" autocomplete="username" placeholder="请输入用户名">
        </label>
        <label class="field">
          <span>密码</span>
          <input id="auth-password" type="password" autocomplete="current-password" placeholder="至少 6 位">
        </label>
        <button type="submit" id="auth-submit" class="btn primary block">登录</button>
      </form>
      <p id="auth-msg" class="msg"></p>
    </div>
  </div>

  <!-- 应用 -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand">📈 仓位计算器</div>
      <div class="user-box"><span id="who"></span><button id="logout-btn" class="link" type="button">退出</button></div>
    </header>

    <main id="page-home" class="page"></main>
    <main id="page-calc" class="page hidden"></main>
    <main id="page-positions" class="page hidden"></main>
    <main id="page-settings" class="page hidden"></main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-btn active" type="button"><span>🏠</span>首页</button>
      <button data-nav="calc" class="nav-btn" type="button"><span>🧮</span>仓位计算</button>
      <button data-nav="positions" class="nav-btn" type="button"><span>📋</span>我的持仓</button>
      <button data-nav="settings" class="nav-btn" type="button"><span>⚙️</span>设置</button>
    </nav>
  </div>

<script src="app.js"></script>
</body>
</html>
